;;; ===== WAKEUP-KOREAN BEGIN (이 표시 사이는 설치 스크립트가 통째로 갈아끼웁니다) =====
;==============================================================================
; 알림전화 (한국어)
;
;   7000 하나만 기억하면 됩니다. 들어가면 음성 메뉴가 안내합니다.
;
;     1번  몇 분 뒤 알람    30      -> "삼십 분 뒤 알람 설정하였습니다"
;     2번  시각 알람        1300    -> "오늘 오후 한 시 정각 알람 설정하였습니다"
;     3번  반복 알람                -> 평일(1) / 주말(2) / 요일별(3) 고른 뒤 시각
;
;   숫자만 누르고 손을 떼면 됩니다. 우물 정자는 안 눌러도 됩니다.
;     4번  예약 목록을 한 건씩 듣고 수정/삭제/다음
;
;   반복 요일:  3번을 누르면 평일(1) / 주말(2) / 요일별(3) / 매일(4) 중 하나.
;               요일별(3)은 화면에 두 개씩 보여 줍니다: 월1 화2 / 수3 목4 /
;               금5 토6 / 일7 매9.  하루만 고르고, 여러 요일은 여러 번 예약.
;
; 규칙과 예약 로직은 전부 /var/lib/asterisk/agi-bin/wakeup.agi 한 곳에 있습니다.
; 다이얼플랜은 AGI 가 돌려준 재생 목록을 틀기만 합니다.
;
; 화면 표시를 끄려면  wk-lib,disp  의 첫 줄에서 WK_NODISP 를 1 로 두세요.
;==============================================================================

;------------------------------------------------------------------------------
; 7000 진입점 — 콜백 방식
;
;   발신 통화(내가 7000 을 거는 경우)는 통화 중 화면 갱신이 안 되는 기종이
;   있습니다(내가 '발신자'라서). 그래서 이 내선으로 시스템이 되걸어(콜백)
;   '수신'으로 메뉴를 진행합니다. 수신은 화면(발신자 이름)이 제대로 뜹니다.
;
;   7000 을 걸면 받고 삐 소리 후 1초 있다 끊고, 이 내선으로 되겁니다(콜백).
;   자동 응답은 전화기 자체 설정(Auto Answer)에 맡깁니다 — 헤더를 안 붙입니다.
;   콜백을 끄고 예전처럼 바로 메뉴로 가려면  WK_NOCB=1 (전역 변수).
;   Custom Destination 대상은 그대로 wakeup-book,s,1 입니다.
;------------------------------------------------------------------------------
[wakeup-book]
exten => s,1,NoOp(알림전화 진입 from ${CALLERID(num)})
 same => n,Set(CALLER=${CALLERID(num)})
 same => n,GotoIf($["${WK_NOCB}" = "1"]?direct)
 ; 로컬 내선(PJSIP 엔드포인트)이 아니면 콜백이 무의미 -> 바로 메뉴
 same => n,Set(DS=${DEVICE_STATE(PJSIP/${CALLER})})
 same => n,GotoIf($["${DS}" = "INVALID"]?direct)
 same => n,GotoIf($["${DS}" = "UNKNOWN"]?direct)
 same => n,GotoIf($[${LEN(${CALLER})} < 2]?direct)
 ; 받고 -> 삐 소리 -> 1초 있다가 끊고 -> 콜백.
 ; (0초에 뚝 끊기면 이상해서 짧게 신호음을 주고 한 박자 쉽니다.)
 same => n,Answer()
 same => n,Wait(0.3)
 same => n,Set(WK_OK=0)
 same => n,AGI(wakeup.agi,callback,,,${CALLER})
 ; 콜백 예약이 실패하면 그냥 이 통화에서 바로 메뉴를 진행합니다
 same => n,GotoIf($["${WK_OK}" != "1"]?direct)
 same => n,PlayTones(1400/150)
 same => n,Wait(0.2)
 same => n,StopPlayTones()
 same => n,Wait(1)
 same => n,Hangup()
 same => n(direct),Goto(wakeup-menu,s,1)

;------------------------------------------------------------------------------
; 콜백 발신 — 그 내선을 부릅니다. 답하면 call file 의 Context(wakeup-menu)로.
;   자동 응답은 전화기 자체 Auto Answer 설정을 씁니다(SIP 헤더 안 붙임).
;------------------------------------------------------------------------------
[wakeup-cb-dial]
exten => _X!,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

;------------------------------------------------------------------------------
; 메인 메뉴 (콜백으로 걸려 들어왔을 때, 또는 WK_NOCB=1 일 때 실행)
;------------------------------------------------------------------------------
[wakeup-menu]
exten => s,1,NoOp(알림전화 메뉴 from ${CALLERID(num)})
 same => n,Answer()
 ; 전화기가 RTP 를 재생하기 시작할 때까지 1초 줍니다 (0.5초는 부족했습니다)
 same => n,Wait(1)
 same => n,Set(TRY=0)
 ; 첫 인사는 한 번만
 same => n,Playback(custom/bank/sil-500&custom/bank/g-hello&custom/bank/g-intro)

 ; 메뉴를 한 항목씩 읽어 주며 화면도 넘깁니다. Playback 이 아니라 Read 로 틀어야
 ; 안내 도중 눌러도(barge-in) 바로 잡힙니다. 각 항목 뒤 1초만 기다렸다 넘어갑니다.
 same => n(menu),Set(TRY=$[${TRY} + 1])
 same => n,GotoIf($[${TRY} > 3]?bye)
 same => n,Set(SEL=)
 same => n,Gosub(wk-lib,disp,1([1]분으로 설정))
 same => n,Read(SEL,custom/bank/sil-250&custom/bank/g-menu-1,1,,1,1)
 same => n,GotoIf($["${SEL}" != ""]?route)
 same => n,Gosub(wk-lib,disp,1([2]시간으로 설정))
 same => n,Read(SEL,custom/bank/g-menu-2,1,,1,1)
 same => n,GotoIf($["${SEL}" != ""]?route)
 same => n,Gosub(wk-lib,disp,1([3]반복으로 설정))
 same => n,Read(SEL,custom/bank/g-menu-3,1,,1,1)
 same => n,GotoIf($["${SEL}" != ""]?route)
 same => n,Gosub(wk-lib,disp,1([4]목록 확인))
 same => n,Read(SEL,custom/bank/g-menu-4,1,,1,1)
 same => n,GotoIf($["${SEL}" != ""]?route)
 same => n,Gosub(wk-lib,disp,1(번호를 누르세요))
 same => n,Read(SEL,,1,,1,4)
 same => n(route),GotoIf($["${SEL}" = "1"]?wk-after,s,1)
 same => n,GotoIf($["${SEL}" = "2"]?wk-time,s,1)
 same => n,GotoIf($["${SEL}" = "3"]?wk-rep,s,1)
 same => n,GotoIf($["${SEL}" = "4"]?wakeup-list,s,1)
 same => n,GotoIf($["${SEL}" = ""]?quiet)
 same => n,Gosub(wk-lib,disp,1(그 번호는 없습니다))
 same => n,Playback(custom/bank/g-nosuch)
 same => n,Goto(menu)
 same => n(quiet),Gosub(wk-lib,disp,1(입력이 없습니다))
 same => n,Playback(custom/bank/g-timeout)
 same => n,Goto(menu)

 ; "종료하겠습니다." 하고 한 템포(1초) 쉬었다가 끊습니다.
 same => n(bye),Gosub(wk-lib,disp,1(종료합니다))
 same => n,Playback(custom/bank/g-bye)
 same => n,Wait(1)
 same => n,Hangup()

;------------------------------------------------------------------------------
; 2번  시각 알람  (HHMM 네 자리)
;------------------------------------------------------------------------------
[wk-time]
; 번호를 누르자마자 말이 시작되면 조급합니다. 반 박자 쉬어 갑니다.
exten => s,1,Wait(0.6)
 same => n,Set(TRY=0)
 same => n,Set(WK_BACK=wk-time)
 same => n,Set(TIMEHELP=)
 same => n(ask),Set(TRY=$[${TRY} + 1])
 same => n,GotoIf($[${TRY} > 3]?wakeup-menu,s,bye)
 same => n,ExecIf($[${TRY} > 1]?Set(TIMEHELP=2))
 same => n,Set(WT=)
 same => n,Gosub(wk-lib,disp,1(시간 설정 (예)13:00=1300))
 ; "숫자 네 자리로. 오전 7시반=0730, 저녁 7시=1900" (24시간제를 알려 줍니다)
 same => n,Read(WT,custom/bank/sil-250&custom/bank/g-enter${TIMEHELP},4,,1,5)
 ; 입력 직후 바로 말하면 급하게 들립니다. 반 박자 쉽니다.
 same => n,ExecIf($["${WT}" != ""]?Wait(0.5))
 same => n,ExecIf($["${WT}" = "*"]?Playback(custom/bank/g-back))
 same => n,GotoIf($["${WT}" = "*"]?wakeup-menu,s,menu)
 same => n,Set(WK_OK=0)
 same => n,Set(WK_ERR=${IF($["${WT}" = ""]?quiet:)})
 same => n,GotoIf($["${WT}" = ""]?wk-lib,bad,1)
 same => n,AGI(wakeup.agi,peek-time,${WT},,${CALLERID(num)})
 same => n,GotoIf($["${WK_OK}" != "1"]?wk-lib,bad,1)
 ; 해석이 됐으면 바로 예약합니다. 확인은 예약 뒤에 받습니다.
 same => n,Set(WK_OK=0)
 same => n,AGI(wakeup.agi,book-time,${WT},,${CALLERID(num)})
 same => n,Goto(wk-lib,done,1)

;------------------------------------------------------------------------------
; 1번  몇 분 후 알람  (1~3자리, 다 누르면 우물정)
;------------------------------------------------------------------------------
[wk-after]
; 번호를 누르자마자 말이 시작되면 조급합니다. 반 박자 쉬어 갑니다.
exten => s,1,Wait(0.6)
 same => n,Set(TRY=0)
 same => n,Set(WK_BACK=wk-after)
 same => n(ask),Set(TRY=$[${TRY} + 1])
 same => n,GotoIf($[${TRY} > 3]?wakeup-menu,s,bye)
 same => n,Set(MIN=)
 same => n,Gosub(wk-lib,disp,1(몇 분 뒤 (예)30분=30))
 ; "분 수를 누르고 우물 정자. 삼십분 뒤면 삼, 공, 우물 정자."
 ; 6 … (뜸) … 0 이 6분으로 확정되지 않게 자리 사이 대기를 5초로 둡니다.
 same => n,Read(MIN,custom/bank/sil-250&custom/bank/g-enter-min,3,,1,5)
 same => n,ExecIf($["${MIN}" != ""]?Wait(0.5))
 same => n,ExecIf($["${MIN}" = "*"]?Playback(custom/bank/g-back))
 same => n,GotoIf($["${MIN}" = "*"]?wakeup-menu,s,menu)
 same => n,Set(WK_OK=0)
 same => n,Set(WK_ERR=${IF($["${MIN}" = ""]?quiet:)})
 same => n,GotoIf($["${MIN}" = ""]?wk-lib,bad,1)
 same => n,AGI(wakeup.agi,peek-after,${MIN},,${CALLERID(num)})
 same => n,GotoIf($["${WK_OK}" != "1"]?wk-lib,bad,1)
 ; 해석이 됐으면 바로 예약합니다. 확인은 예약 뒤에 받습니다.
 same => n,Set(WK_OK=0)
 same => n,AGI(wakeup.agi,book-after,${MIN},,${CALLERID(num)})
 same => n,Goto(wk-lib,done,1)

;------------------------------------------------------------------------------
; 3번  반복 알람  (2단 메뉴: 평일/주말/요일별/매일 -> 시각)
;
;   1단계  평일(1) / 주말(2) / 요일별(3) / 매일(4)
;   2단계  요일별을 골랐으면 하루만 (월1 … 일7, 우물정 없음)
;   3단계  시각 HHMM  -> peek-rep/book-rep 로 확인·등록
;
;   1->DAY=0(평일), 2->DAY=8(주말), 4->DAY=9(매일) 로 매핑해
;   AGI(parse_days)를 그대로 씁니다. 요일별은 한 자리(월1 … 일7).
;------------------------------------------------------------------------------
[wk-rep]
; 번호를 누르자마자 말이 시작되면 조급합니다. 반 박자 쉬어 갑니다.
exten => s,1,Wait(0.6)
 same => n,Set(TRY=0)
 same => n,Set(WK_BACK=wk-rep)
 same => n,Set(TIMEHELP=)

 ; --- 1단계: 평일 / 주말 / 요일별 고르기 --------------------------------------
 same => n(ask),Set(TRY=$[${TRY} + 1])
 same => n,GotoIf($[${TRY} > 3]?wakeup-menu,s,bye)
 same => n,ExecIf($[${TRY} > 1]?Set(TIMEHELP=2))
 same => n,Set(RSEL=)
 same => n,Set(DAY=)
 ; 메인 메뉴처럼 한 항목씩 읽으며 화면을 넘깁니다. Read 로 틀어 barge-in 지원.
 same => n,Gosub(wk-lib,disp,1([1]평일 반복))
 same => n,Read(RSEL,custom/bank/sil-250&custom/bank/g-rep-1,1,,1,1)
 same => n,GotoIf($["${RSEL}" != ""]?rroute)
 same => n,Gosub(wk-lib,disp,1([2]주말 반복))
 same => n,Read(RSEL,custom/bank/g-rep-2,1,,1,1)
 same => n,GotoIf($["${RSEL}" != ""]?rroute)
 same => n,Gosub(wk-lib,disp,1([3]요일별 반복))
 same => n,Read(RSEL,custom/bank/g-rep-3,1,,1,1)
 same => n,GotoIf($["${RSEL}" != ""]?rroute)
 same => n,Gosub(wk-lib,disp,1([4]매일 반복))
 same => n,Read(RSEL,custom/bank/g-rep-4,1,,1,1)
 same => n,GotoIf($["${RSEL}" != ""]?rroute)
 same => n,Gosub(wk-lib,disp,1(번호를 누르세요))
 same => n,Read(RSEL,,1,,1,4)
 same => n(rroute),ExecIf($["${RSEL}" = "*"]?Playback(custom/bank/g-back))
 same => n,GotoIf($["${RSEL}" = "*"]?wakeup-menu,s,menu)
 same => n,GotoIf($["${RSEL}" = "1"]?wday)
 same => n,GotoIf($["${RSEL}" = "2"]?wend)
 same => n,GotoIf($["${RSEL}" = "3"]?daypick)
 same => n,GotoIf($["${RSEL}" = "4"]?wevery)
 same => n,GotoIf($["${RSEL}" = ""]?rquiet)
 same => n,Gosub(wk-lib,disp,1(그 번호는 없습니다))
 same => n,Playback(custom/bank/g-nosuch)
 same => n,Goto(ask)
 same => n(rquiet),Playback(custom/bank/g-timeout)
 same => n,Goto(ask)

 same => n(wday),Set(DAY=0)
 same => n,Goto(gottime)
 same => n(wend),Set(DAY=8)
 same => n,Goto(gottime)
 same => n(wevery),Set(DAY=9)
 same => n,Goto(gottime)

 ; --- 2단계: 요일별 — 하루만 선택. 화면에 두 개씩 보여 주며 넘깁니다.
 ; 여러 요일은 여러 번 예약. 매일은 여기 9번(또는 위 메뉴 4번).
 same => n(daypick),Set(DAY=)
 same => n,Gosub(wk-lib,disp,1([1]월요일[2]화요일))
 same => n,Read(DAY,custom/bank/sil-250&custom/bank/g-day1&custom/bank/g-day2,1,,1,1)
 same => n,GotoIf($["${DAY}" != ""]?droute)
 same => n,Gosub(wk-lib,disp,1([3]수요일[4]목요일))
 same => n,Read(DAY,custom/bank/g-day3&custom/bank/g-day4,1,,1,1)
 same => n,GotoIf($["${DAY}" != ""]?droute)
 same => n,Gosub(wk-lib,disp,1([5]금요일[6]토요일))
 same => n,Read(DAY,custom/bank/g-day5&custom/bank/g-day6,1,,1,1)
 same => n,GotoIf($["${DAY}" != ""]?droute)
 same => n,Gosub(wk-lib,disp,1([7]일요일[9]매일))
 same => n,Read(DAY,custom/bank/g-day7&custom/bank/g-day9,1,,1,1)
 same => n,GotoIf($["${DAY}" != ""]?droute)
 same => n,Gosub(wk-lib,disp,1(번호를 누르세요))
 same => n,Read(DAY,,1,,1,4)
 same => n(droute),NoOp(요일 선택 ${DAY})
 same => n,ExecIf($["${DAY}" != ""]?Wait(0.5))
 ; 별표는 1단계(평일/주말/요일별)로 한 단계만 되돌립니다
 same => n,GotoIf($["${DAY}" = "*"]?ask)
 same => n,GotoIf($["${DAY}" != ""]?gottime)
 ; 무입력이면 1단계로 보내 TRY 가 올라가게 합니다 (무한 반복 방지)
 same => n,Playback(custom/bank/g-timeout)
 same => n,Goto(ask)

 ; --- 3단계: 시각 입력 (세 경로 공통) ----------------------------------------
 same => n(gottime),Gosub(wk-lib,disp,1(시간 설정 (예)13:00=1300))
 same => n,Read(WT,custom/bank/sil-250&custom/bank/g-enter${TIMEHELP},4,,1,5)
 ; 입력 직후 바로 말하면 급하게 들립니다. 반 박자 쉽니다.
 same => n,ExecIf($["${WT}" != ""]?Wait(0.5))
 same => n,ExecIf($["${WT}" = "*"]?Playback(custom/bank/g-back))
 same => n,GotoIf($["${WT}" = "*"]?wakeup-menu,s,menu)
 same => n,Set(WK_OK=0)
 same => n,AGI(wakeup.agi,peek-rep,${DAY},${WT},${CALLERID(num)})
 same => n,GotoIf($["${WK_OK}" != "1"]?wk-lib,bad,1)
 same => n,Set(WK_OK=0)
 same => n,AGI(wakeup.agi,book-rep,${DAY},${WT},${CALLERID(num)})
 same => n,Goto(wk-lib,done,1)

;------------------------------------------------------------------------------
; 세 갈래가 공통으로 쓰는 부분
;------------------------------------------------------------------------------
[wk-lib]
; --- 전화기 화면에 한 줄 띄우기 -----------------------------------------------
; 끄고 싶으면 이 줄을  exten => disp,1,Return()  으로 바꾸면 전부 꺼집니다.
; 음성 안내는 그대로라 기능에는 아무 영향이 없습니다.
;
; pres 를 반드시 먼저 설정해야 합니다. 기본값이 'unavailable' 이라
; 그대로 두면 Asterisk 가 "표시할 수 없는 정보"로 보고 PAI/RPID 를
; 아예 안 실어 보냅니다. send_pai=yes 를 켜도 화면이 안 바뀌는 원인입니다.
;   asterisk -rx 'originate Local/s@... ' 로 확인한 기본값:
;   CONNECTEDLINE(pres) = unavailable
exten => disp,1,GotoIf($["${WK_NODISP}" = "1"]?skip)
 same => n,Set(CONNECTEDLINE(pres)=allowed_not_screened)
 same => n,Set(CONNECTEDLINE(name-charset)=utf8)
 same => n,Set(CONNECTEDLINE(num)=7000)
 same => n,Set(CONNECTEDLINE(name)=${ARG1})
 same => n(skip),Return()

; --- 예약하고 안내한 뒤, 0번을 누르면 되돌립니다 -----------------------------
; 예전에는 "미리 들려주고 -> 확인받고 -> 예약" 이었습니다.
; 지금은 "예약하고 -> 들려주고 -> 틀리면 0번" 입니다.
; 잘 되는 경우(대부분)에 손이 한 번도 더 안 갑니다.
exten => done,1,GotoIf($["${WK_OK}" != "1"]?err)
 ; AGI 실행 자체가 실패하면 WK_CONFIRM 이 비어 있습니다.
 ; 빈 값으로 Playback 하면 통화가 소리 없이 끊깁니다. 반드시 막습니다.
 same => n,GotoIf($["${WK_CONFIRM}" = ""]?err)
 same => n,GotoIf($["${WK_ERR}" = "dup"]?dup)
 same => n,Gosub(wk-lib,disp,1(${WK_DISPLAY} [0]수정))
 ; "십 분 뒤 알람 설정하였습니다. 수정하려면 영번을 눌러 주세요."
 same => n,Set(FIX=)
 ; 확인 안내 뒤 수정(0번) 입력 대기. 짧게 3초 — 그냥 두면(기본) 확정됩니다.
 same => n,Read(FIX,${WK_CONFIRM}&custom/bank/g-fix,1,,1,3)
 same => n,GotoIf($["${FIX}" = "0"]?undo)
 same => n,Gosub(wk-lib,disp,1(${WK_DISPLAY} 설정됨))
 ; "설정되었습니다. 감사합니다."
 same => n,Playback(custom/bank/g-setdone)
 same => n,Wait(0.5)
 same => n,Hangup()

 ; 0번 -> 방금 만든 것만 지우고 처음 입력으로 돌아갑니다
 same => n(undo),Set(WK_OK=0)
 same => n,AGI(wakeup.agi,undo,${WK_KEY},,${CALLERID(num)})
 same => n,Set(WK_ERR=)
 same => n,Goto(${WK_BACK},s,ask)

 ; 이미 같은 시각에 있으면 예약이 새로 안 잡혔으니 0번을 권하지 않습니다
 same => n(dup),Gosub(wk-lib,disp,1(${WK_DISPLAY}))
 same => n,Playback(${WK_CONFIRM})
 same => n,Wait(0.5)
 same => n,Hangup()

 same => n(err),GotoIf($["${WK_ERR}" = "full"]?full)
 same => n,Gosub(wk-lib,disp,1(오류가 났습니다))
 same => n,Playback(custom/bank/g-error)
 same => n,Wait(0.5)
 same => n,Hangup()
 ; 가득 찼으면 "지우세요" 라고만 하고 끊지 말고 목록으로 데려다 줍니다
 same => n(full),Gosub(wk-lib,disp,1(가득 참 - 목록으로))
 same => n,Playback(custom/bank/g-full)
 same => n,Goto(wakeup-list,s,1)

; --- 입력이 잘못됐을 때: 원래 자리로 돌아가 다시 묻습니다 ----------------------
exten => bad,1,ExecIf($["${WK_BACK}" = ""]?Set(WK_BACK=wakeup-menu))
 same => n,GotoIf($["${WK_ERR}" = "full"]?full)
 same => n,Gosub(wk-lib,disp,1(다시 입력해 주세요))
 same => n,GotoIf($["${WK_ERR}" = "quiet"]?q)
 same => n,Playback(custom/bank/g-invalid&custom/bank/g-retry)
 same => n,Goto(back)
 same => n(q),Playback(custom/bank/g-timeout)
 same => n(back),NoOp()
 ; Goto 를 두 인자로 쓰면 (확장,우선순위)라 지금 컨텍스트(wk-lib)에서 찾습니다.
 ; 그래서 예전엔 재시도가 전부 통화 끊김이었습니다. 반드시 세 인자로 씁니다.
 same => n,Goto(${WK_BACK},s,ask)
 same => n(full),Gosub(wk-lib,disp,1(가득 참 - 목록으로))
 same => n,Playback(custom/bank/g-full)
 same => n,Goto(wakeup-list,s,1)

;------------------------------------------------------------------------------
; 메뉴 4번  예약 확인 — 한 건씩 듣고 수정/삭제/다음
;
;   "예약된 알람입니다."
;   (한 건씩)  "매일 오전 일곱 시.  수정하려면 일번, 삭제하려면 이번, 다음은 구번."
;      1 = 수정(지우고 같은 종류 입력 화면으로),  2 = 삭제,  9/무입력 = 다음,  * = 끝
;
;   항목은 AGI 가 남긴 스냅샷 인덱스로 찾습니다. 안내와 입력 사이에 알람 하나가
;   울려 사라져도(그 인덱스는 건너뜀) 엉뚱한 걸 지우지 않습니다.
;------------------------------------------------------------------------------
[wakeup-list]
exten => s,1,NoOp(예약 확인 from ${CALLERID(num)})
 same => n,ExecIf($["${CHANNEL(state)}" != "Up"]?Answer())
 same => n,Wait(0.3)
 same => n,Set(WK_OK=0)
 same => n,Set(WK_COUNT=0)
 ; 목록을 모으고 스냅샷을 저장합니다 (인덱스 밀림 방지)
 same => n,AGI(wakeup.agi,list,,${UNIQUEID},${CALLERID(num)})
 same => n,GotoIf($["${WK_OK}" != "1"]?err)
 same => n,GotoIf($[${WK_COUNT} < 1]?empty)
 same => n,Set(TOTAL=${WK_COUNT})
 same => n,Playback(custom/bank/g-list)
 same => n,Set(I=0)

 ; --- 한 건씩 ----------------------------------------------------------------
 same => n(nextitem),Set(I=$[${I} + 1])
 same => n,GotoIf($[${I} > ${TOTAL}]?done)
 same => n,Set(WK_OK=0)
 same => n,AGI(wakeup.agi,item,${I},${UNIQUEID},${CALLERID(num)})
 ; 그 사이 사라진 항목이면 건너뜁니다
 same => n,GotoIf($["${WK_OK}" != "1"]?nextitem)
 same => n,Set(SEL=)
 ; 화면이 좁아 잘리므로 붙여 씁니다. 다음(9)은 음성으로만 안내(화면엔 생략).
 same => n,Gosub(wk-lib,disp,1(${WK_DISPLAY}[1]수정[2]삭제))
 ; "[매일 오전 일곱 시] 수정하려면 일번, 삭제하려면 이번, 다음은 구번을 눌러 주세요."
 same => n,Read(SEL,custom/bank/sil-250&${WK_ITEM}&custom/bank/sil-250&custom/bank/g-item-ask,1,,1,6)
 same => n,ExecIf($["${SEL}" != ""]?Wait(0.3))
 same => n,GotoIf($["${SEL}" = "*"]?done)
 same => n,GotoIf($["${SEL}" = "1"]?edit)
 same => n,GotoIf($["${SEL}" = "2"]?del)
 ; 9 / 무입력 / 기타 -> 다음 항목
 same => n,Goto(nextitem)

 ; 삭제(2): 이 건만 지우고 다음으로. 인덱스로 지우되 스냅샷은 안 흔들립니다.
 same => n(del),Set(WK_OK=0)
 same => n,AGI(wakeup.agi,del,${I},${UNIQUEID},${CALLERID(num)})
 same => n,GotoIf($["${WK_OK}" != "1"]?nextitem)
 same => n,Gosub(wk-lib,disp,1(${WK_DISPLAY} 삭제))
 same => n,Playback(custom/bank/g-deleted)
 same => n,Goto(nextitem)

 ; 수정(1): 이 건을 지우고 같은 종류의 입력 화면으로 데려갑니다
 same => n(edit),Set(EKIND=${WK_KIND})
 same => n,Set(WK_OK=0)
 same => n,AGI(wakeup.agi,undo,${WK_KEY},,${CALLERID(num)})
 same => n,Gosub(wk-lib,disp,1(다시 설정해 주세요))
 same => n,Playback(custom/bank/g-edit)
 same => n,GotoIf($["${EKIND}" = "rep"]?wk-rep,s,1)
 same => n,Goto(wk-time,s,1)

 ; 목록 끝(또는 *): 처음 홈 메뉴로 돌아갑니다 (끊지 않습니다)
 same => n(done),Gosub(wk-lib,disp,1(처음으로))
 same => n,Playback(custom/bank/g-back)
 same => n,Goto(wakeup-menu,s,1)

 same => n(empty),Gosub(wk-lib,disp,1(예약 없음))
 same => n,Playback(custom/bank/g-none)
 same => n,Wait(0.5)
 same => n,Goto(wakeup-menu,s,1)

 same => n(err),Gosub(wk-lib,disp,1(오류가 났습니다))
 same => n,Playback(custom/bank/g-error)
 same => n,Wait(0.5)
 same => n,Hangup()

;------------------------------------------------------------------------------
; 예약 시각에 걸려오는 전화 — 현재 시각을 알려 주는 안내입니다.
;   WK_SEQ = 안녕하세요 + 알림 써비스입니다 + 현재 시각은 + [시각] + 입니다
;   끝인사 = 좋은 하루 되세요
;------------------------------------------------------------------------------
[wakeup-call]
exten => s,1,NoOp(=== 시간 알림 ext=${WAKEUP_EXT} time=${WAKEUP_TIME} ===)
 same => n,Answer()
 same => n,Wait(1)
 ; 받은 뒤 화면은 '지금 시각'만 보여 줍니다.
 ; STRFTIME(${EPOCH}) 는 통화가 연결된 지금 시각입니다.
 same => n,Set(NOWHM=${STRFTIME(${EPOCH},,%H:%M)})
 same => n,Gosub(wk-lib,disp,1(지금 ${NOWHM}))
 same => n,GotoIf($["${WK_SEQ}" = ""]?legacy)
 same => n,Playback(${WK_SEQ})
 same => n,Wait(0.5)
 ; "좋은 하루 되세요." 하고 한 템포 쉬었다가 끊습니다.
 same => n,Playback(custom/bank/g-goodday)
 same => n,Wait(1)
 same => n,Hangup()

 same => n(legacy),NoOp(WK_SEQ 없는 옛 call file)
 same => n,PlayTones(880/400)
 same => n,Wait(2)
 same => n,StopPlayTones()
 same => n,Hangup()
;;; ===== WAKEUP-KOREAN END =====
